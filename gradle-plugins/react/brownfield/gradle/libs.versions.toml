[versions]
kotlinJvm = "2.2.21"
ktlint = "12.1.1"
detekt = "1.23.7"
# The AGP the plugin compiles against: deliberately the OLDEST supported version, so the
# compiler rejects any accidental use of a newer AGP API. Newer AGP is covered by the
# TestKit matrix in build.gradle.kts. Keep in sync with MIN_AGP in RNBrownfieldPlugin.kt.
agp = "8.12.0"
common = "31.12.0"
asm-commons = "9.7"
versioncompare = "1.5.0"
junit = "5.11.4"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinJvm" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

[libraries]
agp = { module = "com.android.tools.build:gradle", name = "agp", version.ref = "agp" }
common = { module = "com.android.tools:common", version.ref = "common" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm-commons" }
versioncompare = { module = "io.github.g00fy2:versioncompare", version.ref = "versioncompare" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
